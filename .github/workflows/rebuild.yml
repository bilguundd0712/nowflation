name: rebuild

on:
  schedule:
    - cron: "0 3 * * *" # 11:00 Ulaanbaatar, daily; idempotent — commits only on change
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Build page (live NSO fetch, cache fallback)
        run: python build_nowflation.py

      - name: Build aimag monitor
        run: python build_aimag.py

      - name: Commit refreshed page, caches and ledger
        run: |
          git config user.name "nowflation-rebuild"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "rebuild: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
